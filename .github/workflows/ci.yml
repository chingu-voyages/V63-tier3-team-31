name: CI
on:
  push:
  pull_request:
jobs:
  client-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run client tests (allow no tests yet)
        run: npm run test --workspace=client -- --passWithNoTests
      - name: Run server tests (allow no tests yet)
        run: npm run test --workspace=server -- --passWithNoTests
      - name: Build all workspaces
        run: npm run build
